services:
  postgres:
    image: postgres:16-alpine
    container_name: a1prime-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: a1prime_local
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d a1prime_local']
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - a1prime-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: a1prime-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  a1prime-postgres-data:
