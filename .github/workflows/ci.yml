name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  lint:
    name: Lint and Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Typecheck all
        run: npm run typecheck:all
      - name: Lint all
        run: npm run lint:all

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: a1prime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/a1prime_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_ENABLED: true
      JWT_SECRET: ci-test-secret-32-chars-minimum-ok
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Run unit tests
        run: npm run test:unit --workspace=backend
      - name: Run API tests
        run: npm run test:api --workspace=backend
      - name: Run Jest tests
        run: npm run test --workspace=backend

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: lint
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Run frontend unit tests
        run: npm run test:unit --workspace=frontend
      - name: Build frontend
        run: npm run build --workspace=frontend

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: a1prime_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/a1prime_e2e
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      REDIS_ENABLED: true
      JWT_SECRET: ci-test-secret-32-chars-minimum-ok
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      NEXT_PUBLIC_API_URL: http://localhost:8080
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install deps
        run: npm ci
      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium
      - name: Run migrations
        run: npm run migrate:phase1:up --workspace=backend
      - name: Seed admin user
        run: npm run seed:admin --workspace=backend
        env:
          ADMIN_EMAIL: admin@a1prime.com
          ADMIN_PASSWORD: Admin123!
      - name: Start backend
        run: npm run dev --workspace=backend &
      - name: Wait for backend
        run: npx wait-on http://localhost:8080/health --timeout 30000
      - name: Start frontend
        run: cd frontend && npm run build && npm start &
      - name: Wait for frontend
        run: npx wait-on http://localhost:3000 --timeout 30000
      - name: Run Playwright tests
        run: npm run test:e2e --workspace=frontend
      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
