name: Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint + Type-check ──────────────────────────────────────────────────
  validate:
    name: Validate (lint + typecheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Typecheck — backend
        working-directory: backend
        run: npm run typecheck

      - name: Typecheck — frontend
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint — backend
        working-directory: backend
        run: npm run lint

  # ── 2. Unit + Integration Tests ──────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install root dependencies
        run: npm ci

      - name: Run backend unit tests (vitest)
        working-directory: backend
        run: npm run test:unit

      - name: Run backend integration tests (vitest)
        working-directory: backend
        run: npm run test:api
        env:
          JWT_SECRET: ci-test-secret-do-not-use-in-production
          ENCRYPTION_KEY: ci-test-encryption-key-not-for-production
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
          REDIS_ENABLED: 'false'

  # ── 3. Deploy Frontend Preview to Vercel ─────────────────────────────────
  preview-frontend:
    name: Preview → Vercel (frontend)
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      pull-requests: write
    outputs:
      preview_url: ${{ steps.deploy.outputs.preview_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel environment
        working-directory: frontend
        run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}

      - name: Build project
        working-directory: frontend
        run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}

      - name: Deploy to Vercel
        id: deploy
        working-directory: frontend
        run: |
          PREVIEW_URL=$(vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }} 2>&1 | tail -1)
          echo "preview_url=$PREVIEW_URL" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_FRONTEND }}

      - name: Post preview URL to PR
        uses: actions/github-script@v7
        with:
          script: |
            const previewUrl = '${{ steps.deploy.outputs.preview_url }}';
            const body = [
              '## 🚀 Preview Environment Ready',
              '',
              `| | |`,
              `|---|---|`,
              `| **Frontend** | [${previewUrl}](${previewUrl}) |`,
              `| **Commit** | \`${{ github.sha }}\` |`,
              `| **Branch** | \`${{ github.head_ref }}\` |`,
              '',
              '> Preview is updated automatically on every push to this PR.',
            ].join('\n');

            // Find existing bot comment and update it, or create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(c =>
              c.user.type === 'Bot' && c.body.includes('Preview Environment Ready')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  # ── 4. AI PR Review ──────────────────────────────────────────────────────
  ai-review:
    name: AI Code Review
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate diff
        id: diff
        run: |
          git diff origin/${{ github.base_ref }}...HEAD \
            -- '*.ts' '*.tsx' '*.sql' \
            > /tmp/pr.diff
          echo "diff_size=$(wc -c < /tmp/pr.diff)" >> "$GITHUB_OUTPUT"

      - name: AI Review via Claude
        if: steps.diff.outputs.diff_size != '0'
        uses: ./.github/actions/ai-pr-review
        with:
          diff_path: /tmp/pr.diff
          github_token: ${{ secrets.GITHUB_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          pr_number: ${{ github.event.pull_request.number }}
          repo: ${{ github.repository }}
