name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  NODE_VERSION: '20'

jobs:
  # ─────────────────────────────────────────
  # 1. Lint & Type-check (frontend + backend)
  # ─────────────────────────────────────────
  lint:
    name: Lint & Type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install root deps
        run: npm ci

      - name: Install workspace deps
        run: |
          cd packages/schemas && npm ci
          cd ../../frontend && npm ci
          cd ../backend && npm ci

      - name: Typecheck schemas
        run: cd packages/schemas && npx tsc --noEmit

      - name: Typecheck frontend
        run: cd frontend && npm run typecheck

      - name: Typecheck backend
        run: cd backend && npm run typecheck

      - name: Lint frontend
        run: cd frontend && npm run lint

      - name: Lint backend
        run: cd backend && npm run lint

  # ─────────────────────────────────────────
  # 2. Backend unit + integration tests
  # ─────────────────────────────────────────
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: a1prime_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/a1prime_test
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: ci-test-secret-32-chars-minimum-ok
      ENCRYPTION_KEY: ci-test-encryption-key-padded-ok1

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install deps
        run: |
          cd packages/schemas && npm ci
          cd ../../backend && npm ci

      - name: Run unit tests (services)
        run: cd backend && npm run test:unit

      - name: Run API route tests
        run: cd backend && npm run test:api

      - name: Run Jest tests
        run: cd backend && npm test

  # ─────────────────────────────────────────
  # 3. Frontend build check
  # ─────────────────────────────────────────
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    needs: lint

    env:
      NEXT_PUBLIC_API_URL: http://localhost:8080

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install deps
        run: |
          cd packages/schemas && npm ci
          cd ../../frontend && npm ci

      - name: Build frontend
        run: cd frontend && npm run build

  # ─────────────────────────────────────────
  # 4. E2E tests (Playwright) — runs on main only
  # ─────────────────────────────────────────
  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [test-backend, build-frontend]
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: a1prime_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/a1prime_e2e
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: 6379
      JWT_SECRET: ci-test-secret-32-chars-minimum-ok
      ENCRYPTION_KEY: ci-test-encryption-key-padded-ok1
      NEXT_PUBLIC_API_URL: http://localhost:8080

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install all deps
        run: |
          cd packages/schemas && npm ci
          cd ../../backend && npm ci
          cd ../frontend && npm ci

      - name: Install Playwright browsers
        run: cd frontend && npx playwright install --with-deps chromium

      - name: Run migrations
        run: cd backend && npm run migrate:phase1:up
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/a1prime_e2e

      - name: Seed admin user
        run: cd backend && npm run seed:admin
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/a1prime_e2e
          ADMIN_EMAIL: admin@a1prime.com
          ADMIN_PASSWORD: Admin123!

      - name: Start backend
        run: cd backend && npm run dev &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/a1prime_e2e

      - name: Wait for backend
        run: npx wait-on http://localhost:8080/health --timeout 30000

      - name: Start frontend
        run: cd frontend && npm run build && npm start &

      - name: Wait for frontend
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Run Playwright E2E tests
        run: cd frontend && npx playwright test

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
